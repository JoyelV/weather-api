<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather AI — live observations for India</title>
<meta name="description" content="Current weather conditions for cities in India, read off the instruments and explained in plain language.">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🌦</text></svg>">
</head>
<body>

<div class="shell">

  <header class="masthead">
    <div class="masthead__mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <circle cx="12" cy="12" r="3.2"></circle>
        <path d="M12 2.4v2.6M12 19v2.6M2.4 12h2.6M19 12h2.6M5.2 5.2l1.9 1.9M16.9 16.9l1.9 1.9M18.8 5.2l-1.9 1.9M7.1 16.9l-1.9 1.9"></path>
      </svg>
    </div>
    <div class="masthead__text">
      <h1 class="masthead__title">Weather<span>AI</span></h1>
      <p class="masthead__tag">Live observations · India</p>
    </div>
  </header>

  <main>

    <section class="intro">
      <p class="intro__lede">
        Current conditions for any city in India — read off the
        instruments, then explained in plain language.
      </p>
    </section>

    <section class="search" aria-labelledby="search-heading">
      <h2 class="visually-hidden" id="search-heading">Search for a city</h2>

      <form class="search__form" id="search-form" novalidate>
        <div class="search__field">
          <label class="search__label" for="city">City</label>
          <input
            class="search__input"
            id="city"
            name="city"
            type="text"
            value="Kochi"
            autocomplete="off"
            autocapitalize="words"
            spellcheck="false"
            placeholder="Kochi"
            aria-describedby="search-hint"
          >
        </div>
        <button class="search__button" id="search-button" type="submit">
          <span class="search__button-label">Get weather</span>
          <span class="search__spinner" aria-hidden="true"></span>
        </button>
      </form>

      <p class="search__hint" id="search-hint">
        Try
        <button class="chip" type="button" data-city="Kochi">Kochi</button>
        <button class="chip" type="button" data-city="Jaipur">Jaipur</button>
        <button class="chip" type="button" data-city="Shillong">Shillong</button>
        <button class="chip" type="button" data-city="Leh">Leh</button>
      </p>
    </section>

    <section class="stage" aria-labelledby="stage-heading">
      <h2 class="visually-hidden" id="stage-heading">Weather reading</h2>

      <!-- One live region for every state change, so screen readers hear the
           result, the error and the loading notice in the same place. -->
      <div class="stage__slot" id="stage" aria-live="polite" aria-busy="false"></div>
    </section>

  </main>

  <footer class="colophon">
    <p>
      Observations from <span class="colophon__src">Open-Meteo</span>.
      Explanations written by <span class="colophon__src">Google Gemini</span>.
    </p>
    <p><a class="colophon__link" href="/docs">API reference</a></p>
  </footer>

</div>

<script src="app.js"></script>
</body>
</html>
